services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: zivo-app:latest
    container_name: zivo-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: postgres
    depends_on:
      - postgres

  postgres:
    image: postgres:16
    container_name: zivo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: zivo
      POSTGRES_USER: zivo_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - zivo-postgres-data:/var/lib/postgresql/data

  nginx:
    image: nginx:alpine
    container_name: zivo-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt/live/api.zivoapp.cloud/fullchain.pem:/etc/nginx/ssl/fullchain.pem:ro
      - /etc/letsencrypt/live/api.zivoapp.cloud/privkey.pem:/etc/nginx/ssl/privkey.pem:ro

    depends_on:
      - app

volumes:
  zivo-postgres-data:


